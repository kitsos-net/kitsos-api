<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Kitsos Keys Admin (dev)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f0f12; color: #e4e4e7; }
  header { padding: 12px 20px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #layout { display: flex; height: calc(100vh - 49px); }
  nav { width: 180px; border-right: 1px solid #27272a; padding: 10px 0; }
  nav button { display: block; width: 100%; text-align: left; padding: 8px 16px; background: none; border: none; color: #a1a1aa; cursor: pointer; font-size: 13px; }
  nav button.active { background: #27272a; color: #fff; }
  main { flex: 1; padding: 20px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #27272a; vertical-align: top; word-break: break-all; }
  th { color: #71717a; font-weight: 500; }
  textarea { width: 100%; height: 90px; background: #18181b; color: #e4e4e7; border: 1px solid #3f3f46; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  button.action { background: #3b82f6; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px; }
  button.danger { background: #ef4444; padding: 3px 8px; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 11px; }
  #signin { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .hint { color: #71717a; font-size: 11px; margin: 4px 0 12px; }
  .out { font-size: 11px; color: #4ade80; margin-top: 6px; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="signin"><div id="clerk-signin"></div></div>

<div id="app" style="display:none">
  <header>
    <h1>Kitsos Keys Admin — <span style="color:#71717a">nur für dich, kein production UI</span></h1>
    <div>
      <span id="whoami" style="font-size:12px;color:#a1a1aa;margin-right:12px"></span>
      <button id="signout" style="background:none;border:1px solid #3f3f46;color:#a1a1aa;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px">Sign out</button>
    </div>
  </header>
  <div id="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<script src="https://clerk.kitsos.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        data-clerk-publishable-key="pk_live_Y2xlcmsua2l0c29zLm5ldCQ"></script>
<script>
const API = "https://keys.api.kitsos.net";

// Each panel: label, GET path (list), POST path + hint for the create form, optional DELETE path builder
const PANELS = {
  apps:      { label: "Apps",       list: "/admin/apps",       create: "/admin/apps",
               hint: '{"id":"dns-manager","name":"DNS Manager","environment":"production"}',
               del: (row) => `/admin/apps/${row.id}` },
  users:     { label: "Users",      list: "/admin/users",      create: null },
  groups:    { label: "Groups",     list: "/admin/groups",     create: "/admin/groups",
               hint: '{"name":"admins","description":"..."}',
               del: (row) => `/admin/groups/${row.id}` },
  policies:  { label: "Policies",   list: "/admin/policies",   create: "/admin/policies",
               hint: '{"appId":"mail","subjectType":"user","subjectId":"user_...","scopes":["mail:send"]}',
               del: (row) => `/admin/policies/${row.id}` },
  keys:      { label: "API Keys",   list: "/admin/api-keys",   create: "/admin/api-keys",
               hint: '{"userId":"user_...","appId":"mail","name":"my key","scopes":["mail:send"]}',
               del: (row) => `/admin/api-keys/${row.id}` },
  limits:    { label: "Usage Limits", list: "/admin/usage-limits", create: "/admin/usage-limits",
               hint: '{"userId":"user_...","appId":"mail","limitType":"emails_per_day","limitValue":100,"isOverride":true}' },
  requests:  { label: "Increase Requests", list: "/admin/limit-increase-requests?status=pending", create: null },
  audit:     { label: "Audit Log",  list: "/admin/audit-log?limit=100", create: null },
};

let activePanel = "apps";

async function authedFetch(path, opts = {}) {
  const token = await window.Clerk.session.getToken();
  const res = await fetch(API + path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
  });
  return res;
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  for (const [key, panel] of Object.entries(PANELS)) {
    const btn = document.createElement("button");
    btn.textContent = panel.label;
    btn.className = key === activePanel ? "active" : "";
    btn.onclick = () => { activePanel = key; render(); };
    nav.appendChild(btn);
  }
}

function renderTable(rows) {
  if (!rows || rows.length === 0) return "<p class='hint'>Keine Einträge.</p>";
  const cols = Object.keys(rows[0]);
  const panel = PANELS[activePanel];
  let html = "<table><thead><tr>" + cols.map(c => `<th>${c}</th>`).join("") + (panel.del ? "<th></th>" : "") + "</tr></thead><tbody>";
  for (const row of rows) {
    html += "<tr>" + cols.map(c => `<td>${row[c] === null || row[c] === undefined ? "" : String(row[c])}</td>`).join("");
    if (panel.del) html += `<td><button class="danger" data-id="${row.id}">löschen</button></td>`;
    html += "</tr>";
  }
  return html + "</tbody></table>";
}

async function render() {
  renderNav();
  const panel = PANELS[activePanel];
  const main = document.getElementById("main");
  main.innerHTML = "<p class='hint'>Lädt…</p>";

  const res = await authedFetch(panel.list);
  const data = await res.json();

  let html = renderTable(Array.isArray(data) ? data : [data]);

  if (panel.create) {
    html += `
      <h3 style="font-size:13px;color:#a1a1aa;margin-top:20px">Neu anlegen</h3>
      <p class="hint">Rohes JSON, wie es der Endpoint erwartet. Beispiel:<br>${panel.hint}</p>
      <textarea id="createInput">${panel.hint}</textarea>
      <button class="action" id="createBtn">Erstellen</button>
      <div class="out" id="createOut"></div>
    `;
  }

  main.innerHTML = html;

  main.querySelectorAll("button.danger").forEach((btn) => {
    btn.onclick = async () => {
      const row = { id: btn.dataset.id };
      if (!confirm(`${row.id} wirklich löschen?`)) return;
      await authedFetch(panel.del(row), { method: "DELETE" });
      render();
    };
  });

  const createBtn = document.getElementById("createBtn");
  if (createBtn) {
    createBtn.onclick = async () => {
      const out = document.getElementById("createOut");
      try {
        const body = document.getElementById("createInput").value;
        JSON.parse(body); // validate before sending
        const res = await authedFetch(panel.create, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
        });
        const json = await res.json().catch(() => ({}));
        out.textContent = `HTTP ${res.status}: ${JSON.stringify(json)}`;
        if (res.ok) render();
      } catch (e) {
        out.textContent = "Fehler: " + e.message;
      }
    };
  }
}

window.addEventListener("load", async () => {
  await window.Clerk.load();

  if (window.Clerk.user) {
    document.getElementById("signin").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("whoami").textContent = window.Clerk.user.primaryEmailAddress?.emailAddress ?? window.Clerk.user.id;
    document.getElementById("signout").onclick = () => window.Clerk.signOut();
    render();
  } else {
    window.Clerk.mountSignIn(document.getElementById("clerk-signin"));
  }
});
</script>
</body>
</html>
