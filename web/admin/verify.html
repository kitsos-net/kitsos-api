<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Kitsos Verify (dev)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f0f12; color: #e4e4e7; padding: 20px; }
  h1 { font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 16px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #27272a; word-break: break-all; }
  th { color: #71717a; font-weight: 500; }
  input, select { width: 100%; padding: 6px; background: #18181b; color: #e4e4e7; border: 1px solid #3f3f46; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box; }
  label { display: block; font-size: 11px; color: #71717a; margin-bottom: 2px; }
  button { background: #3b82f6; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.small { padding: 3px 8px; font-size: 11px; margin-right: 4px; }
  .out { font-size: 11px; color: #4ade80; margin-top: 6px; white-space: pre-wrap; }
  #signin { display: flex; align-items: center; justify-content: center; height: 100vh; }
</style>
</head>
<body>
<div id="signin"><div id="clerk-signin"></div></div>

<div id="app" style="display:none">
  <h1>Kitsos Verify — nur dev, vorübergehend — <a href="/" style="color:#71717a">Keys</a> · <a href="/hme.html" style="color:#71717a">HME</a></h1>

  <table id="resourceTable"></table>

  <h2 style="font-size:13px;color:#a1a1aa">Neue Verifizierung starten</h2>
  <label>App ID</label>
  <select id="appId"></select>
  <label>Resource Type</label>
  <select id="resourceType">
    <option value="email_address">email_address</option>
    <option value="zone">zone</option>
  </select>
  <label>Value</label>
  <input id="value" placeholder="dion@kitsos.net oder domain.de" />
  <label>Methode</label>
  <select id="method">
    <option value="dns_txt">dns_txt</option>
    <option value="magic_link">magic_link</option>
  </select>
  <label>Scopes (Komma-getrennt)</label>
  <input id="scopes" placeholder="mail:send" />
  <button id="registerBtn">Registrieren</button>
  <div class="out" id="registerOut"></div>
</div>

<script src="https://clerk.kitsos.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        data-clerk-publishable-key="pk_live_Y2xlcmsua2l0c29zLm5ldCQ"></script>
<script>
const API = "https://verify.api.kitsos.net";
const KEYS_API = "https://keys.api.kitsos.net";

async function authedFetch(path, opts = {}) {
  const token = await window.Clerk.session.getToken();
  return fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` } });
}

async function loadApps() {
  const token = await window.Clerk.session.getToken();
  const select = document.getElementById("appId");
  try {
    const res = await fetch(KEYS_API + "/admin/apps", { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error("not admin or fetch failed");
    const apps = await res.json();
    if (!apps.length) throw new Error("no apps");
    select.innerHTML = apps.map(a => `<option value="${a.id}">${a.id} — ${a.name}</option>`).join("");
  } catch {
    // Fallback: free-text if we can't reach keys-api's admin routes (e.g. not an admin)
    select.outerHTML = `<input id="appId" placeholder="mail" />`;
  }
}

async function loadResources() {
  const res = await authedFetch("/resources");
  const rows = await res.json();
  const table = document.getElementById("resourceTable");
  if (!rows.length) { table.innerHTML = "<tr><td style='color:#71717a'>Keine Ressourcen.</td></tr>"; return; }
  table.innerHTML = "<tr><th>Value</th><th>Methode</th><th>Verifiziert</th><th>Reverify fällig</th><th></th></tr>" +
    rows.map(r => `
      <tr>
        <td>${r.value}</td>
        <td>${r.method}</td>
        <td>${r.verified_at ? new Date(r.verified_at * 1000).toLocaleString() : "—"}</td>
        <td>${r.reverify_due_at ? new Date(r.reverify_due_at * 1000).toLocaleDateString() : "—"}</td>
        <td>${!r.verified_at && r.method === "dns_txt" ? `<button class="small" data-check="${r.id}">DNS prüfen</button>` : ""}</td>
      </tr>
    `).join("");

  table.querySelectorAll("[data-check]").forEach(btn => {
    btn.onclick = async () => {
      const res = await authedFetch(`/resources/${btn.dataset.check}/check-dns`, { method: "POST" });
      const json = await res.json();
      alert(json.verified ? "Verifiziert!" : `Noch nicht — erwartet: ${json.expected}, gefunden: ${JSON.stringify(json.found)}`);
      loadResources();
    };
  });
}

document.getElementById("registerBtn").onclick = async () => {
  const out = document.getElementById("registerOut");
  const body = {
    appId: document.getElementById("appId").value,
    resourceType: document.getElementById("resourceType").value,
    value: document.getElementById("value").value,
    method: document.getElementById("method").value,
    scopes: document.getElementById("scopes").value.split(",").map(s => s.trim()).filter(Boolean),
  };
  const res = await authedFetch("/resources", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json();
  out.textContent = `HTTP ${res.status}: ${JSON.stringify(json, null, 2)}`;
  if (res.ok) loadResources();
};

window.addEventListener("load", async () => {
  await window.Clerk.load();
  if (window.Clerk.user) {
    document.getElementById("signin").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadApps();
    loadResources();
  } else {
    window.Clerk.mountSignIn(document.getElementById("clerk-signin"));
  }
});
</script>
</body>
</html>
