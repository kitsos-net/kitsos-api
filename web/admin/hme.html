<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Kitsos HME (dev)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f0f12; color: #e4e4e7; padding: 20px; }
  h1 { font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 16px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #27272a; word-break: break-all; }
  th { color: #71717a; font-weight: 500; }
  input { width: 100%; padding: 6px; background: #18181b; color: #e4e4e7; border: 1px solid #3f3f46; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box; }
  label { display: block; font-size: 11px; color: #71717a; margin-bottom: 2px; }
  button { background: #3b82f6; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.small { padding: 3px 8px; font-size: 11px; margin-right: 4px; }
  button.danger { background: #ef4444; }
  .out { font-size: 11px; color: #4ade80; margin-top: 6px; white-space: pre-wrap; }
  #signin { display: flex; align-items: center; justify-content: center; height: 100vh; }
</style>
</head>
<body>
<div id="signin"><div id="clerk-signin"></div></div>

<div id="app" style="display:none">
  <h1>Kitsos Hide My Email — nur dev, vorübergehend — <a href="/" style="color:#71717a">Keys</a> · <a href="/verify.html" style="color:#71717a">Verify</a></h1>

  <table id="aliasTable"></table>

  <h2 style="font-size:13px;color:#a1a1aa">Neuen Alias erstellen</h2>
  <label>Forward an (muss verifizierte email_address Resource sein)</label>
  <select id="forwardTo"></select>
  <label>Label (optional)</label>
  <input id="label" placeholder="z.B. Netflix Signup" />
  <button id="createBtn">Erstellen</button>
  <div class="out" id="createOut"></div>
</div>

<script src="https://clerk.kitsos.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        data-clerk-publishable-key="pk_live_Y2xlcmsua2l0c29zLm5ldCQ"></script>
<script>
const API = "https://hme.api.kitsos.net";
const VERIFY_API = "https://verify.api.kitsos.net";

async function authedFetch(path, opts = {}) {
  const token = await window.Clerk.session.getToken();
  return fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` } });
}

async function loadForwardOptions() {
  const token = await window.Clerk.session.getToken();
  const select = document.getElementById("forwardTo");
  try {
    const res = await fetch(VERIFY_API + "/resources", { headers: { Authorization: `Bearer ${token}` } });
    const resources = await res.json();
    const verified = resources.filter(r => r.resource_type === "email_address" && r.verified_at);
    if (!verified.length) throw new Error("none verified");
    select.innerHTML = verified.map(r => `<option value="${r.value}">${r.value}</option>`).join("");
  } catch {
    select.outerHTML = `<input id="forwardTo" placeholder="dion@kitsos.net (keine verifizierten Adressen gefunden — erst über Verify anlegen)" />`;
  }
}

async function loadAliases() {
  const res = await authedFetch("/aliases");
  const rows = await res.json();
  const table = document.getElementById("aliasTable");
  if (!rows.length) { table.innerHTML = "<tr><td style='color:#71717a'>Keine Aliase.</td></tr>"; return; }
  table.innerHTML = "<tr><th>Alias</th><th>Forward an</th><th>Label</th><th>Status</th><th>Weitergeleitet</th><th></th></tr>" +
    rows.map(r => `
      <tr>
        <td>${r.alias}@${r.domain}</td>
        <td>${r.forward_to}</td>
        <td>${r.label ?? ""}</td>
        <td>${r.status}</td>
        <td>${r.emails_forwarded}</td>
        <td>
          <button class="small" data-toggle="${r.id}" data-status="${r.status === "active" ? "disabled" : "active"}">${r.status === "active" ? "deaktivieren" : "aktivieren"}</button>
          <button class="small danger" data-delete="${r.id}">löschen</button>
        </td>
      </tr>
    `).join("");

  table.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.onclick = async () => {
      await authedFetch(`/aliases/${btn.dataset.toggle}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: btn.dataset.status }),
      });
      loadAliases();
    };
  });
  table.querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Alias wirklich löschen?")) return;
      await authedFetch(`/aliases/${btn.dataset.delete}`, { method: "DELETE" });
      loadAliases();
    };
  });
}

document.getElementById("createBtn").onclick = async () => {
  const out = document.getElementById("createOut");
  const body = {
    forwardTo: document.getElementById("forwardTo").value,
    label: document.getElementById("label").value || undefined,
  };
  const res = await authedFetch("/aliases", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json();
  out.textContent = `HTTP ${res.status}: ${JSON.stringify(json, null, 2)}`;
  if (res.ok) loadAliases();
};

window.addEventListener("load", async () => {
  await window.Clerk.load();
  if (window.Clerk.user) {
    document.getElementById("signin").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadForwardOptions();
    loadAliases();
  } else {
    window.Clerk.mountSignIn(document.getElementById("clerk-signin"));
  }
});
</script>
</body>
</html>
