name = "verify"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "verify.api.kitsos.net", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "kitsos-api-eu"
database_id = "a48e2262-6180-4154-b26b-e36ec4aedc13"

[[kv_namespaces]]
binding = "AUTH_CACHE"
id = "86fb5bad46c6458d91cbb322b7178ccf"

[[kv_namespaces]]
binding = "USAGE_COUNTERS"
id = "4823ab0d3fd6452e8437631a3717f2b5"

# Secrets — set via `wrangler secret put <name>`:
#   CLERK_SECRET_KEY
#   CLERK_PUBLISHABLE_KEY
#   ADMIN_GROUP_ID
#   MAIL_API_KEY       (key owned by system:verify-mailer, app mail, scope mail:send)
#   AXIOM_TOKEN
#   AXIOM_DATASET
