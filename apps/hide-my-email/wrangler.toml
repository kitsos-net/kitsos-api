name = "hide-my-email"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "hme.api.kitsos.net", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "kitsos-api"
database_id = "c5ccab68-5f60-4b28-8ce9-20c57b8622ea"

[[kv_namespaces]]
binding = "AUTH_CACHE"
id = "86fb5bad46c6458d91cbb322b7178ccf"

[[kv_namespaces]]
binding = "USAGE_COUNTERS"
id = "4823ab0d3fd6452e8437631a3717f2b5"

# Secrets — set via `wrangler secret put <name>`:
#   CLERK_SECRET_KEY
#   CLERK_PUBLISHABLE_KEY
#   AXIOM_TOKEN
#   AXIOM_DATASET
#   CF_EMAIL_API_TOKEN   (manages Email Routing addresses + rules — account-level "addresses" scope works, zone-level "rules" scope confirmed working against the kitsos.net zone)

# NOT set here — manual Cloudflare dashboard steps required (see README):
#   1. Enable Email Routing for the hme.kitsos.net zone
#   2. Add a catch-all (or per-alias) route pointing to this worker's `email()` handler
#   3. Destination addresses used in `forward_to` must be verified in Email Routing first —
#      Cloudflare will not relay to unverified addresses
